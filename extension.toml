id = "tsrs"
name = "tsrs"
description = "TypeScript language support with the tsrs Rust language server."
version = "0.1.0"
schema_version = 1
authors = ["Zul Faza Makarima", "Zed Industries <hello@zed.dev>"]
repository = "https://github.com/zulfaza/zed-tsrs"


[language_servers.tsrs]
name = "tsrs"
language_ids = { TypeScript = "typescript", TSX = "typescriptreact", JavaScript = "javascript", JSX = "javascriptreact" }
languages = ["TypeScript", "TSX", "JavaScript", "JSX"]
